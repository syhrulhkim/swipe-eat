name: swipe_eat
description: A Forui-first mobile app for Swipe Eat, backed by Supabase.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  cupertino_icons: ^1.0.8
  # Hashes the Apple sign-in nonce.
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  forui: ^0.22.3
  geocoding: ^5.0.0
  geolocator: ^14.0.2
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  # Plays the small vector loops in assets/lottie (splash mark, spinner,
  # empty-state art). Bundled JSON only — nothing is fetched at runtime.
  lottie: ^3.3.2
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^8.1.0
  supabase_flutter: ^2.17.2
  # Hands a maps / navigation URL to the OS so directions open in the maps app.
  url_launcher: ^6.3.1
  webview_flutter: ^4.13.0
  # The platform packages are direct dependencies because the TikTok player
  # needs their gesture/inline-playback settings, which the facade does not
  # expose.
  webview_flutter_android: ^4.14.0
  webview_flutter_wkwebview: ^3.26.0
  sentry_flutter: ^8.14.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    # Hand-authored vector loops, a few KB each. Kept deliberately small and
    # abstract: a spinner, a heart and a location pulse, not illustrations.
    - assets/lottie/

  # Both families are bundled rather than fetched at runtime: the app now
  # serves a cached deck with no connection, and a first offline launch that
  # falls back to the platform font would undo half the redesign.
  #
  # Upstream ships these as variable fonts. The files here are static
  # instances cut from those (Bricolage at opsz 36, both at wdth 100), because
  # Flutter picks a face by the weights declared below and cannot instance a
  # variable axis from a `fontWeight` alone. Licences sit next to them.
  fonts:
    # Display face: headlines, restaurant names, screen titles.
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-800.ttf
          weight: 800
    # Text face: body copy, labels, chips, form fields.
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-400.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-500.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-600.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-700.ttf
          weight: 700
