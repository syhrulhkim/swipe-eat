name: swipe_eat
description: A Forui-first mobile app for Swipe Eat, backed by Supabase.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  cupertino_icons: ^1.0.8
  # Hashes the Apple sign-in nonce.
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  forui: ^0.22.3
  geocoding: ^5.0.0
  geolocator: ^14.0.2
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^8.1.0
  supabase_flutter: ^2.17.2
  # Hands a maps / navigation URL to the OS so directions open in the maps app.
  url_launcher: ^6.3.1
  webview_flutter: ^4.13.0
  # The platform packages are direct dependencies because the TikTok player
  # needs their gesture/inline-playback settings, which the facade does not
  # expose.
  webview_flutter_android: ^4.14.0
  webview_flutter_wkwebview: ^3.26.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Inter (the reference design's typeface) needs no asset entry here: forui
  # already ships the full 100-900 family as a package font, so the app uses
  # 'packages/forui/Inter' — bundled, so no runtime download and no
  # first-frame flash of the platform fallback.
