name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Matches the SDK the app is developed against; see the `environment`
          # block in pubspec.yaml.
          flutter-version: 3.47.1
          channel: stable
          cache: true

      # Keyed on the lockfile so the cache is reused until a dependency
      # actually changes.
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: flutter pub get

      # No `dart format` gate: the source is hand-wrapped and 18 files would
      # fail today. Worth adding once the tree has been formatted in one
      # deliberate pass.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
